# Kalshi agent configuration. Secrets do NOT live here — see .env.example.

mode: paper  # paper | live. Live requires explicit --mode live override.

kalshi:
  base_url_paper: https://demo-api.kalshi.co/trade-api/v2
  base_url_live: https://api.elections.kalshi.com/trade-api/v2
  ws_url_paper: wss://demo-api.kalshi.co/trade-api/ws/v2
  ws_url_live: wss://api.elections.kalshi.com/trade-api/ws/v2
  rate_limit_writes_per_second: 8   # below the 10/s basic tier limit
  rate_limit_reads_per_second: 18   # below the 20/s basic tier limit

risk:
  # Position and exposure caps
  max_position_per_market_usd: 25.0
  max_total_exposure_usd: 200.0
  max_daily_loss_usd: 50.0
  # Hard per-order ceiling — never exceeded regardless of Kelly output
  per_order_max_contracts: 50
  # Runaway-loop guard — trips kill switch if exceeded
  max_orders_per_minute: 10
  # Minimum edge after fees, in basis points (200 = 2%)
  min_edge_after_fees_bps: 200
  # Fractional Kelly multiplier
  kelly_fraction: 0.25
  # Hard cap on size as fraction of bankroll, regardless of Kelly recommendation
  max_kelly_size_pct_bankroll: 0.05
  # API error spike threshold for automatic kill switch
  error_spike_threshold: 5
  error_spike_window_seconds: 60

fees:
  taker_rate: 0.07
  maker_taker_ratio: 0.25  # maker fee is 25% of taker
  assume_taker: true       # conservative: size as if all fills are taker

markets:
  whitelist_categories:
    - economics
    - kpi
  # Optional explicit ticker allowlist (empty = allow all in whitelisted categories)
  whitelist_tickers: []

discord:
  notify_on:
    - trade
    - error
    - kill_switch
    - eod_summary
    - weekly_summary

api:
  host: 127.0.0.1
  port: 8787

kill_switch:
  halt_file_path: /var/lib/kalshi-agent/HALT

storage:
  db_path: /var/lib/kalshi-agent/kalshi-agent.db

journal:
  log_dir: /var/log/kalshi-agent
  retention_days: 90

schedule:
  # America/New_York; EOD lands after most Kalshi markets close
  eod_summary_cron: "59 23 * * *"
  weekly_summary_cron: "59 23 * * 0"
  reconciliation_interval_seconds: 3600
  strategy_tick_seconds: 60
  risk_monitor_tick_seconds: 1
  fill_poll_interval_seconds: 5
  bankroll_ttl_seconds: 10.0
  ws_watchdog_timeout_seconds: 60.0
  display_timezone: America/New_York

strategy:
  # active: placeholder | llm_assessor
  # The block matching `active` MUST be present; the other can be omitted.
  active: llm_assessor
  # Placeholder is allowed in paper mode only by default. Live mode refuses to
  # start with placeholder unless allow_placeholder_live is deliberately set true.
  allow_placeholder_live: false

  llm_assessor:
    # Manual mode: list specific tickers here, only those are assessed.
    # Auto-discovery mode (recommended): leave tickers empty, set `categories`.
    tickers: []
    categories:                 # used when tickers is empty
      - economics
      - kpi
    max_markets_per_tick: 20    # cap LLM calls per tick (cost control)
    min_volume_contracts: 100   # skip illiquid markets
    min_hours_to_close: 2.0     # skip markets about to settle
    discovery_max_pages: 5      # max pages of 200 to scan per discovery run
    min_edge: 0.04              # require >=4% edge before producing a signal
    min_confidence: 0.6         # require >=0.6 LLM confidence
    signal_ttl_minutes: 10
    min_seconds_between_signals_per_ticker: 1800

  # Smoke-test strategy. Only used when `active: placeholder`.
  # Emits one no-op signal/hour against `test_ticker` to validate the pipeline.
  # placeholder:
  #   test_ticker: KXPRES-28-DEM
  #   emit_interval_seconds: 3600

llm:
  base_url: https://openrouter.ai/api/v1
  # Any OpenRouter model id works (anthropic/claude-sonnet-4.6,
  # openai/gpt-5, google/gemini-2.5-pro, meta-llama/llama-4-405b, etc.)
  # NOTE: avoid ":free" model variants here — they share a strict account-wide
  # rate limit (429s) regardless of credit balance, and some free endpoints are
  # slow enough to exceed timeout_seconds and return empty completions.
  model: anthropic/claude-sonnet-4.6
  temperature: 0.2
  max_tokens: 1024
  timeout_seconds: 60.0
  # Minimum seconds between consecutive OpenRouter requests (rate-limit guard).
  request_interval_seconds: 0.25
